[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "weak-sindy"
version = "1.2.0"
description = "General-purpose N-dimensional weak-form fractional PDE discovery, exogenous control (weakSINDYc), multi-order fractional operators, sklearn integration, and conformal ensemble UQ"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Avery Karlin", email = "ak5232@columbia.edu" }
]
keywords = [
    "SINDy",
    "weakSINDYc",
    "weak-form",
    "fractional-calculus",
    "Grunwald-Letnikov",
    "sparse-regression",
    "uncertainty-quantification",
    "conformal-prediction",
    "PDE-discovery",
    "Lyapunov-exponents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
]

[project.optional-dependencies]
sklearn = [
    "scikit-learn>=1.2.0",
]
cli = [
    "click>=8.0.0",
]
dev = [
    "click>=8.0.0",
    "scikit-learn>=1.2.0",
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
weaksindy = "weaksindy.cli:main"

[project.urls]
Homepage = "https://github.com/akarlin3/weakSINDY"
Repository = "https://github.com/akarlin3/weakSINDY"
Issues = "https://github.com/akarlin3/weakSINDY/issues"
Archive = "https://doi.org/10.5281/zenodo.20637003"

[tool.hatch.build.targets.wheel]
packages = ["src/weaksindy"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
